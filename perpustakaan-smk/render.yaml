services:
  - type: web
    name: perpustakaan-smk
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: PUSTAKANUSA_SECRET
        generateValue: true
      - key: PUSTAKANUSA_COOKIE_SECURE
        value: "true"
